<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Menu - Mobile Fix</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        /* The Start Button - Necessary for Mobile Permissions */
        #start-button {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px; background: #ff4757;
            color: white; border: none; border-radius: 50px;
            font-size: 18px; font-weight: bold; z-index: 999;
            cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .hidden { display: none !important; }
    </style>
</head>

<body>
    <button id="start-button">Tap to Open Menu</button>

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; facingMode: environment;"
        renderer="antialias: true; alpha: true; precision: medium;">
        
        <a-assets>
            <a-asset-item id="food" src="menu.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: red; opacity: 0.5;" scale="0.2 0.2 0.2"></a-box>
            
            <a-entity
                gltf-model="#food"
                scale="1 1 1"
                position="0 0 0"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        // This script handles the mobile "Start" gesture
        const btn = document.querySelector('#start-button');
        const scene = document.querySelector('a-scene');

        btn.addEventListener('click', () => {
            // Hide the button and let the scene start
            btn.classList.add('hidden');
            
            // Check if scene is already loaded, otherwise wait
            if (scene.hasLoaded) {
                runAR();
            } else {
                scene.addEventListener('loaded', runAR);
            }
        });

        function runAR() {
            console.log("AR Scene Starting...");
        }
    </script>
</body>
</html>
