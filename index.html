<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Menu - Fixed</title>
    
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@v1.3.0/dist/aframe-master.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #loading-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: white; z-index: 999; display: flex; 
            flex-direction: column; justify-content: center; align-items: center;
        }
        button {
            padding: 20px 40px; font-size: 20px; background: #007bff;
            color: white; border: none; border-radius: 10px; cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="loading-screen">
        <button onclick="startAR()">START AR MENU</button>
        <p style="margin-top: 15px; color: #666;">Allow camera access when prompted</p>
    </div>

    <a-scene 
        embedded 
        vr-mode-ui="enabled: false"
        arjs="sourceType: webcam; debugUIEnabled: false; facingMode: environment;"
        renderer="logarithmicDepthBuffer: true;">
        
        <a-assets>
            <a-asset-item id="food-model" src="menu.glb"></a-asset-item>
        </a-assets>

        <a-marker preset="hiro">
            <a-cylinder position="0 0.1 0" radius="0.2" height="0.2" color="#FFC107" opacity="0.5"></a-cylinder>
            
            <a-entity
                gltf-model="#food-model"
                scale="0.5 0.5 0.5"
                position="0 0 0"
                rotation="0 0 0">
            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        function startAR() {
            document.getElementById('loading-screen').style.display = 'none';
        }
        
        // Error logging for your model
        document.querySelector('#food-model').addEventListener('model-error', (e) => {
            console.error("Model failed to load:", e);
            alert("Model file 'menu.glb' not found. Check your GitHub file list!");
        });
    </script>
</body>
</html>
