<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      /* This ensures the camera takes up the full screen on mobile */
      body { margin: 0; overflow: hidden; }
      #debug-text { position: fixed; top: 10px; left: 10px; z-index: 10; background: white; padding: 5px; font-family: sans-serif; }
    </style>
  </head>

  <body>
    <div id="debug-text">Point camera at HIRO marker</div>
    
    <a-scene embedded vr-mode-ui="enabled: false" arjs="sourceType: webcam; debugUIEnabled: false;">
      
      <a-assets>
        <a-asset-item id="food" src="menu.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <a-box position="0 0.5 0" material="color: red; opacity: 0.7;" scale="0.3 0.3 0.3"></a-box>
        
        <a-entity
          gltf-model="#food"
          scale="1 1 1"
          position="0 0 0"
          rotation="0 0 0">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
