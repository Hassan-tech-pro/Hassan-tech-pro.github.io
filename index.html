<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Menu Mobile</title>
    
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      /* Force the camera to fill the mobile screen */
      body { margin: 0; overflow: hidden; height: 100vh; width: 100vw; }
      #arjs-video { object-fit: cover !important; width: 100vw !important; height: 100vh !important; }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene 
      embedded 
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix;"
      renderer="logarithmicDepthBuffer: true; precision: medium;">
      
      <a-assets>
        <a-asset-item id="food" src="menu.glb"></a-asset-item>
      </a-assets>

      <a-marker preset="hiro">
        <a-box position="0 0.5 0" material="color: red; opacity: 0.6;" scale="0.2 0.2 0.2"></a-box>
        
        <a-entity
          gltf-model="#food"
          scale="0.5 0.5 0.5"
          position="0 0 0"
          rotation="0 0 0"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 15000; easing: linear">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
